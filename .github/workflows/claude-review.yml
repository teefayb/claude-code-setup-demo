# Automated PR review with Claude Code.
# Setup (once, by a repo admin):
#   1. Install the Claude GitHub app on the repo (run `/install-github-app` in Claude Code).
#   2. Add the repository secret ANTHROPIC_API_KEY in Settings → Secrets and variables → Actions.
# The key lives only in GitHub's secret store; it is never committed.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as the code-reviewer subagent in
            .claude/agents/code-reviewer.md would, using CLAUDE.md as the standard.
            Only report real problems: bugs, security issues, missing tests for changed
            behaviour, and broken repo conventions. Use inline comments for specific lines
            and one short summary comment with a verdict. No praise, no generic advice.
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
